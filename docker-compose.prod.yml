version: "3.9"

# =============================================================================
# SmartIntern-ET — Production Containerized Docker Compose Environment
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 with pgvector extension for ML embeddings
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smartintern_prod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartintern_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-smartintern_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - smartintern_prod_network

  # ---------------------------------------------------------------------------
  # Redis 7 Alpine cache and Celery broker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: smartintern_prod_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - smartintern_prod_network

  # ---------------------------------------------------------------------------
  # Node.js Express Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartintern_prod_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-smartintern_db}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      ETHIO_SMS_API_KEY: ${ETHIO_SMS_API_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    volumes:
      - media_volume:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "server.js"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://127.0.0.1:8000/api/health/ || exit 1",
        ]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - smartintern_prod_network

  # ---------------------------------------------------------------------------
  # React 18 Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartintern_prod_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    networks:
      - smartintern_prod_network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (SSL, Static/Media, WebSockets, SPA Routing)
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: smartintern_prod_nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - staticfiles_data:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - smartintern_prod_network

# -----------------------------------------------------------------------------
# Named Volumes
# -----------------------------------------------------------------------------
volumes:
  pgdata:
  redisdata:
  staticfiles_data:
  media_volume:
  ai_models_cache:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  smartintern_prod_network:
    driver: bridge

